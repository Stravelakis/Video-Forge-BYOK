name: Deploy docs site

# Builds on every version tag, or by hand from the Actions tab (same set-up as
# Stravelakis/mystory). The docs site lives in /site (the shared docs-theme,
# STANDARDS section 7). Its text comes from GUIDE.md, INSTALL.md and
# docs/glossary.yml (site/scripts/sync-docs.mjs runs before the build).
# GitHub Pages serves it under the organisation's custom domain at
# https://docs.stravelakis.com/Video-Forge-BYOK/ (site/astro.config.mjs `base`).
# One-time repo settings: Pages -> Source: GitHub Actions; Environments ->
# github-pages -> allow tags v* to deploy. After a deploy, lighthouse.yml checks it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.DOCS_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.DOCS_DIR }}
      - run: npm run build
        working-directory: ${{ env.DOCS_DIR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DOCS_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
