BYOK:
  explainer: true
  eli5: You bring your own key. The app uses your account, not ours, so nobody else sees or pays for your stuff.
  english: "Bring Your Own Key: you paste your own API key, it stays on your device, and the service bills you directly."
  dev: Client-held provider credentials, stored locally; no proxy server between the app and the provider.

API key:
  eli5: A secret password that lets an app use someone else's service, like a library card for a robot.
  english: A private code that proves you're allowed to use an online service. Whoever has it can use your account, so it stays secret.
  dev: Bearer credential sent with each request to authenticate and bill calls to a provider's API.

Viseme:
  eli5: A mouth shape that goes with a sound, so the puppet's mouth moves the right way.
  english: One of a small set of mouth shapes used to animate speech. Video Forge uses nine.
  dev: A visual phoneme class; here 9 shapes selected from forced-alignment timings.

Forced alignment:
  eli5: Matching each word of the script to the exact moment it is spoken.
  english: Lining up the script with the recorded voice so each word has a precise start and end time.
  dev: Aligning known transcript text to audio to get word and phoneme timestamps, instead of estimating from duration.

Remotion:
  eli5: A tool that builds videos out of web pages, frame by frame.
  english: A video-making tool that draws each frame like a web page and turns the frames into a video file.
  dev: React-based programmatic video framework; renders frames in a headless Chromium.

FFmpeg:
  eli5: A tool that glues pictures and sound together into a video file.
  english: A free program that joins, converts and encodes video and audio.
  dev: Command-line multimedia framework used here for encoding and muxing.

Piper:
  eli5: A voice that runs on your own computer. It is plain, but quick.
  english: A text-to-speech engine that runs locally. The voice is flat but fast, good for checking timing.
  dev: Local neural TTS engine; no network, no per-use cost.

DramaBox:
  eli5: A voice that can act, like whispering or laughing, when you tell it to.
  english: A text-to-speech engine that follows stage directions in the script. It runs on a rented graphics card.
  dev: Directable TTS engine; stage directions steer the performance and are not spoken.
